<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>截个图 · 快捷菜单</title>
<link rel="stylesheet" href="tray-menu.css"><script src="tray-menu.js" defer></script>
</head>
<body>
<header class="brand">
<img class="brand-icon" src="../assets/app-icon.png" alt="" draggable="false">
<div class="brand-copy"><strong>截个图</strong><span>随手截一下</span></div>
</header>
<main id="menu" class="menu" role="menu" aria-label="截个图快捷菜单">
<button id="capture" class="item primary" type="button" role="menuitem" data-action="capture">
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 2H2v4m12-4h4v4M2 14v4h4m12-4v4h-4"/><rect x="6" y="6" width="8" height="8" rx="1"/></svg>
<span class="label">开始截图</span>
<kbd id="hotkey">F1</kbd>
</button>
<button id="finish-scroll" class="item" type="button" role="menuitem" data-action="finish-scroll" hidden>
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v8.5m0 0L6.5 8m3.5 3.5L13.5 8M3.5 16h13"/></svg>
<span class="label">完成长截图</span>
</button>
<div class="rule" role="separator"></div>
<button id="open-folder" class="item" type="button" role="menuitem" data-action="open-folder">
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 6.5h15v8.3a1.2 1.2 0 0 1-1.2 1.2H3.7a1.2 1.2 0 0 1-1.2-1.2z"/><path d="M2.5 6.5 4 3h4.3l1.5 3.5"/></svg>
<span class="label">打开截图文件夹</span>
</button>
<button id="open-last" class="item" type="button" role="menuitem" data-action="open-last" disabled>
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.5" width="14" height="13" rx="1.5"/><path d="m4.5 13 3.5-3 2.5 2 2.5-2.5 2.5 2.5"/><circle cx="12.5" cy="7.2" r="1.1"/></svg>
<span class="label">打开最近截图</span>
</button>
<div class="rule" role="separator"></div>
<button id="settings" class="item" type="button" role="menuitem" data-action="settings">
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h7m4 0h3M3 14h3m4 0h7"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="14" r="2"/></svg>
<span class="label">设置</span>
<svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m8.5 5 5 5-5 5"/></svg>
</button>
<button id="help" class="item" type="button" role="menuitem" data-action="help">
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8.1 8a2 2 0 1 1 2.7 1.9c-.6.2-.8.6-.8 1.1v.3"/><path d="M10 13.8h.01"/></svg>
<span class="label">使用帮助</span>
<svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m8.5 5 5 5-5 5"/></svg>
</button>
<div class="rule" role="separator"></div>
<button id="quit" class="item quiet" type="button" role="menuitem" data-action="quit">
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v6.5"/><path d="M6.2 5.6a6 6 0 1 0 7.6 0"/></svg>
<span class="label">退出截个图</span>
</button>
</main>
</body>
</html>
