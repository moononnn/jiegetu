<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
<title>截个图 · 框选截图</title><link rel="stylesheet" href="selection.css"><link rel="stylesheet" href="exit-confirmation.css"><link rel="stylesheet" href="theme.css"><script src="exit-confirmation.js" defer></script><script src="selection.js" defer></script><script src="scroll-capture.mjs" type="module"></script></head>
<body><img id="desktop" alt="" draggable="false"><div id="veil"></div><div id="box" hidden><i class="handle nw" aria-hidden="true"></i><i class="handle n" aria-hidden="true"></i><i class="handle ne" aria-hidden="true"></i><i class="handle e" aria-hidden="true"></i><i class="handle se" aria-hidden="true"></i><i class="handle s" aria-hidden="true"></i><i class="handle sw" aria-hidden="true"></i><i class="handle w" aria-hidden="true"></i></div><img id="long-preview" title="点击查看完整长图；预览缩放不会改变保存或复制的图片尺寸" alt="点击放大查看已接长图" role="button" tabindex="0" draggable="false" hidden>
<p id="hint" role="status">拖动框选 · Esc 退出</p>
<aside id="long-capture-tip" aria-label="长截图操作提示"><strong>滚轮 / ↑↓ <span>开启长截图</span></strong><small>鼠标放选区内 · 页面需可滚动</small></aside>
<section id="image-viewer" role="dialog" aria-modal="true" aria-label="长图原图预览" aria-describedby="viewer-status" aria-owns="actions" hidden>
<header class="viewer-header"><strong>长图预览</strong><div class="viewer-controls"><button id="zoom-out" type="button" title="缩小预览，图片尺寸不变" aria-label="缩小">−</button><span id="zoom-label" aria-live="polite">100%</span><button id="zoom-in" type="button" title="放大预览，图片尺寸不变" aria-label="放大">＋</button><button id="zoom-fit" type="button" title="按窗口宽度查看，图片尺寸不变">适合宽度</button><button id="zoom-original" type="button" title="以100%缩放查看，图片尺寸不变">原尺寸</button><button id="viewer-close" type="button" title="返回长图缩略预览，图片保留；也可按 Esc">返回 · Esc</button></div></header>
<div id="viewer-scroll" tabindex="0" aria-label="按住图片拖动或滚动查看长图"><img id="viewer-image" alt="完整长截图" draggable="false"></div>
<p id="viewer-status" role="status">按住图片拖动 · 滚轮查看 · Ctrl＋滚轮缩放 · Esc 返回</p>
</section>
<div id="actions" role="group" aria-label="选区操作" hidden><div class="action-group" role="group" aria-label="后续操作"><button id="edit" type="button" title="在独立的图片编辑窗口里标完整原图：马赛克、画笔、直线、矩形和箭头；返回预览保留编辑">编辑</button><button id="record-gif" type="button" title="把选区内后续的实时画面录成 GIF：点这里才开始采屏，最长 30 秒；录制浮条可用「停止」或 Esc 结束；仅支持单屏内的选区">录制 GIF</button></div><div class="action-group action-output" role="group" aria-label="输出"><button id="save-as" type="button" title="每次选位置，从上次那个文件夹开始；保存成功后退出">另存</button><button id="save" type="button" title="直接保存到设置好的文件夹，不弹窗；成功后退出">保存</button><button id="copy" type="button" title="复制图片到剪贴板并退出，不自动保存文件">复制 ↵</button></div><div class="action-group action-exit" role="group" aria-label="退出"><button id="retake" type="button" title="丢弃当前成图及编辑，返回框选；尚未保存的内容将不再保留" hidden>重新框选</button></div></div>
</body></html>
